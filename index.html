<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef1f6">
<meta name="description" content="本地優先的間隔複習閃卡，液態玻璃介面，可選接入 LLM 輔助複習。">
<title>溫故</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="src/styles/tokens.css">
<link rel="stylesheet" href="src/styles/spring.css">
<link rel="stylesheet" href="src/styles/app.css">
<link rel="stylesheet" href="src/styles/motion.css">
</head>
<body>

<div class="wallpaper" aria-hidden="true">
  <span class="blob-1"></span>
  <span class="blob-2"></span>
  <span class="blob-3"></span>
  <span class="blob-4"></span>
</div>

<main class="shell">
  <header class="app-header">
<h1 class="large-title"><span data-cursor="blend" data-i18n="app.title">溫故</span></h1>
    <div class="header-actions">
      <button id="settingsButton" class="icon-button" type="button"
              data-i18n-aria-label="app.settings" aria-label="設定">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7.5h8M17 7.5h3M4 16.5h3M12 16.5h8"/>
          <circle cx="14.5" cy="7.5" r="2.2"/>
          <circle cx="9.5" cy="16.5" r="2.2"/>
        </svg>
      </button>
      <button id="themeButton" class="icon-button" type="button"
              data-i18n-aria-label="app.theme" aria-label="切換外觀">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/></svg>
      </button>
    </div>
  </header>

  <!-- 新增卡片 -->
  <section class="glass-card" id="composeCard">
    <div class="card-stack">
      <input id="question" class="field" type="text" autocomplete="off"
             data-i18n-placeholder="compose.question" placeholder="輸入問題（正面）"/>
      <input id="answer" class="field" type="text" autocomplete="off"
             data-i18n-placeholder="compose.answer" placeholder="輸入答案（背面）"/>
      <select id="category" class="field field-select" data-i18n-aria-label="compose.category" aria-label="分類">
        <option value="語文">語文</option>
        <option value="數學">數學</option>
        <option value="英語">英語</option>
        <option value="物理">物理</option>
        <option value="化學">化學</option>
        <option value="地理">地理</option>
      </select>
      <button id="aiGenerateButton" class="btn btn-quiet" type="button" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.6l1.9 4.6 4.6 1.9-4.6 1.9L12 16.6l-1.9-4.6L5.5 10.1l4.6-1.9z"/>
          <path d="M18.5 15.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z"/>
        </svg>
        <span data-i18n="ai.generate">AI 生成卡片</span>
      </button>
      <button id="addButton" class="btn btn-primary" type="button" data-i18n="compose.add">新增卡片</button>
    </div>
  </section>

  <!-- 今日任務 -->
  <section class="glass-card" id="todayCard">
    <h2 class="card-title">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="5" width="17.6" height="15.8" rx="4"/><path d="M3.2 10h17.6M8 3.4v3.2M16 3.4v3.2"/></svg>
      <span data-i18n="today.title">今日必須複習</span>
    </h2>
    <div class="card-stack">
      <div id="taskCount" class="meta tnum"></div>
      <div class="progress" role="progressbar" aria-label="複習進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progressBar" class="progress-fill"></div>
      </div>
      <div id="taskList" class="card-stack"></div>
      <div id="progress" class="meta tnum"></div>
    </div>
  </section>

  <!-- 卡片管理 -->
  <section class="glass-card" id="manageCard">
    <h2 class="card-title">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 3.2 7.6 12 12l8.8-4.4L12 3.2Z"/><path d="M3.2 12.4 12 16.8l8.8-4.4"/><path d="M3.2 16.6 12 21l8.8-4.4"/></svg>
      <span data-i18n="manage.title">已新增卡片管理</span>
    </h2>
    <div class="toolbar">
      <input id="searchKeyword" class="field" type="search" autocomplete="off"
             data-i18n-placeholder="manage.search" placeholder="關鍵字搜尋"/>
      <div class="toolbar-row">
        <select id="filterCategory" class="field field-select" data-i18n-aria-label="manage.filter.all">
          <option value="全部">全部分類</option>
        </select>
        <select id="sortOrder" class="field field-select" data-i18n-aria-label="manage.sort.added">
          <option value="added" data-i18n="manage.sort.added">按新增時間</option>
          <option value="nextReview" data-i18n="manage.sort.nextReview">按下次複習時間</option>
        </select>
      </div>
    </div>
    <div id="manageList" class="card-stack"></div>
    <div id="categoryStats" class="meta tnum"></div>
  </section>
</main>

<!-- 模組若被瀏覽器擋下（例如用 file:// 直接開啟），下面的傳統 script 會接手說明原因 -->
<div class="boot-help" id="bootHelp" hidden>
  <div class="glass-card">
    <h2 class="card-title">需要用本機伺服器開啟</h2>
    <p class="hint">
      這個專案用原生 ES 模組，瀏覽器會基於 CORS 規則擋掉 <code>file://</code> 下的模組載入，
      所以直接雙擊 <code>index.html</code> 不會動。這是瀏覽器的安全規則，不是檔案壞了。
    </p>
    <p class="hint"><strong>最快的方式</strong>：回到專案資料夾，雙擊 <code>start.cmd</code>。</p>
    <p class="hint">或用指令：</p>
    <pre><code>cd /d D:\Reminder
node scripts\serve.mjs</code></pre>
    <p class="hint">然後開啟 <code>http://localhost:4173/</code>（埠被占用時會自動往後找）。</p>
  </div>
</div>

<script>
  // 傳統 script 一定會執行；等 1.5 秒還沒看到旗標，就代表模組沒跑起來。
  setTimeout(function () {
    if (!window.__SMART_REVIEW_BOOTED__) {
      var help = document.getElementById("bootHelp");
      if (help) help.hidden = false;
    }
  }, 1500);
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
